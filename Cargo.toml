[package]
name = "lightagent"
version = "0.1.2"
edition = "2021"
authors = ["Anilcan Kara"]
description = "Zero-Dependency, State-Preserving Agent CLI"
license = "MIT"
repository = "https://github.com/Ankara-Software/lightagent"
homepage = "https://ankarayazilim.org/acik-kaynak/lightagent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
