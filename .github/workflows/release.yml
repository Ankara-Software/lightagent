name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tickets:
    name: Artifact tickets
    runs-on: [self-hosted, s31]
    outputs:
      tickets: ${{ steps.t.outputs.tickets }}
    steps:
      - id: t
        uses: Ankara-Software/ci-actions/artifact-ticket@v1
        with:
          names: lightagent-linux-x64 lightagent-linux-arm64 lightagent-darwin-x64 lightagent-darwin-arm64 lightagent-win32-x64.exe
          hours: "6"

  build:
    name: Build - ${{ matrix.target }}
    needs: tickets
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: '["self-hosted","s31"]'
            target: x86_64-unknown-linux-gnu
            asset_name: lightagent-linux-x64
            use_cross: false
          - os: linux
            runner: '["self-hosted","s31"]'
            target: aarch64-unknown-linux-gnu
            asset_name: lightagent-linux-arm64
            use_cross: true
          - os: macos
            runner: '["self-hosted","macOS","s11"]'
            target: x86_64-apple-darwin
            asset_name: lightagent-darwin-x64
            use_cross: false
          - os: macos
            runner: '["self-hosted","macOS","s11"]'
            target: aarch64-apple-darwin
            asset_name: lightagent-darwin-arm64
            use_cross: false
          - os: windows
            runner: '["self-hosted","Windows","s18"]'
            target: x86_64-pc-windows-msvc
            asset_name: lightagent-win32-x64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (Standard)
        if: ${{ !matrix.use_cross }}
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build binary (Cross)
        if: matrix.use_cross
        run: cross build --target ${{ matrix.target }} --release

      - name: Prepare asset (Windows)
        if: matrix.os == 'windows'
        run: |
          mv target\${{ matrix.target }}\release\lightagent.exe ${{ matrix.asset_name }}

      - name: Prepare asset (Unix)
        if: matrix.os != 'windows'
        run: |
          mv target/${{ matrix.target }}/release/lightagent ${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: Ankara-Software/ci-actions/artifact-upload@v1
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)[matrix.asset_name]) }}

  release:
    name: Create GitHub Release
    needs: [tickets, build]
    runs-on: [self-hosted, s31]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download lightagent-linux-x64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: lightagent-linux-x64
          path: ./artifacts/lightagent-linux-x64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['lightagent-linux-x64']) }}

      - name: Download lightagent-linux-arm64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: lightagent-linux-arm64
          path: ./artifacts/lightagent-linux-arm64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['lightagent-linux-arm64']) }}

      - name: Download lightagent-darwin-x64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: lightagent-darwin-x64
          path: ./artifacts/lightagent-darwin-x64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['lightagent-darwin-x64']) }}

      - name: Download lightagent-darwin-arm64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: lightagent-darwin-arm64
          path: ./artifacts/lightagent-darwin-arm64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['lightagent-darwin-arm64']) }}

      - name: Download lightagent-win32-x64.exe
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: lightagent-win32-x64.exe
          path: ./artifacts/lightagent-win32-x64.exe
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['lightagent-win32-x64.exe']) }}

      - name: Flatten artifacts directory
        run: |
          mkdir dist
          find ./artifacts -type f -exec cp {} ./dist/ \;
          ls -la ./dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/lightagent-linux-x64
            dist/lightagent-linux-arm64
            dist/lightagent-darwin-x64
            dist/lightagent-darwin-arm64
            dist/lightagent-win32-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
